<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Hub 1</title>
    <!-- Tailwind CSS for vibrant, modern, and playful UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons for child-friendly visual elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka One / Quicksand for rounded, kid-friendly typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F0F4F8;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-fun {
            font-family: 'Fredoka', sans-serif;
        }
        /* Custom scrollbar for beautiful UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F0F4F8;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="pb-24 max-w-md mx-auto bg-white min-h-screen shadow-xl relative flex flex-col justify-between">

    <!-- Sound Toggle Floating Button -->
    <div class="fixed top-4 right-4 z-50 bg-white/80 backdrop-blur-md p-2 rounded-full shadow-lg border border-slate-200">
        <button id="soundToggleBtn" onclick="toggleSound()" class="w-10 h-10 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-600 font-bold transition hover:scale-105">
            <i id="soundIcon" class="fas fa-volume-up"></i>
        </button>
    </div>

    <!-- MAIN APP CONTAINER FOR VIEWS -->
    <main id="viewContainer" class="flex-1 p-5 w-full">
        <!-- Views will be dynamically injected here via JS -->
    </main>

    <!-- BOTTOM NAVIGATION BAR (Hidden on Setup Screen) -->
    <nav id="bottomNav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-100 shadow-2xl py-2 px-4 flex justify-between items-center z-40 rounded-t-2xl hidden">
        <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
            <i class="fas fa-house text-lg"></i>
            <span>Home</span>
        </button>
        <button onclick="switchView('learn')" id="nav-learn" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
            <i class="fas fa-book-open text-lg"></i>
            <span>Learn</span>
        </button>
        <button onclick="switchView('practice')" id="nav-practice" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
            <i class="fas fa-pencil-alt text-lg"></i>
            <span>Practice</span>
        </button>
        <button onclick="switchView('progress')" id="nav-progress" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
            <i class="fas fa-trophy text-lg"></i>
            <span>Progress</span>
        </button>
        <button onclick="switchView('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
            <i class="fas fa-user text-lg"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- DIALOGS / POPUPS -->
    <div id="resetModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-6 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl animate-bounce-short">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 text-2xl flex items-center justify-center rounded-full mx-auto mb-4">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="font-fun text-xl text-slate-800 mb-2">Reset Progress?</h3>
            <p class="text-sm text-slate-500 mb-6">Are you sure you want to reset all your learning progress?</p>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl text-sm active:scale-95 transition">Cancel</button>
                <button onclick="confirmResetProgress()" class="flex-1 py-3 bg-rose-500 text-white font-bold rounded-2xl text-sm active:scale-95 transition shadow-lg shadow-rose-200">Reset Progress</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & CONTENT -->
    <script>
        // --- DATA ARCHITECTURE ---
        const TOPICS = [
            { id: 1, title: "Nouns", desc: "Naming words for people, places, animals, and things.", def: "A noun is a naming word. It names a person, place, animal, or thing.", note: "Remember: A noun is a naming word.", examples: { Person: "teacher, mother, Ali", Place: "school, park, Malaysia", Animal: "cat, elephant, bird", Thing: "book, pencil, table" }, activity: { type: "tap-nouns", instruction: "Tap all the nouns from the words below!", options: [{word: "Apple", isCorrect: true}, {word: "Run", isCorrect: false}, {word: "Doctor", isCorrect: true}, {word: "Happy", isCorrect: false}, {word: "Cat", isCorrect: true}, {word: "Sing", isCorrect: false}] } },
            { id: 2, title: "Common & Proper Nouns", desc: "General names vs specific unique names.", def: "Common nouns are everyday general naming words. Proper nouns are special, specific names that always start with a Capital Letter.", note: "Proper nouns always begin with a Capital Letter!", examples: { "Common Nouns": "boy, school, country, car", "Proper Nouns": "Ali, SK Taman Ceria, Malaysia, Proton Saga" }, activity: { type: "choose-correct", instruction: "Which one is a Proper Noun?", options: [{word: "Kuala Lumpur", isCorrect: true}, {word: "city", isCorrect: false}] } },
            { id: 3, title: "Singular & Plural Nouns", desc: "One item versus more than one item.", def: "Singular means only ONE. Plural means MORE THAN ONE. We usually add 's' or 'es' to plural words.", note: "Add 's' for standard plurals, and 'es' for words ending in ch, sh, x, s.", examples: { Singular: "one cat, one box, one boy", Plural: "three cats, two boxes, many boys" }, activity: { type: "choose-correct", instruction: "What is the plural of 'Bus'?", options: [{word: "Buses", isCorrect: true}, {word: "Buss", isCorrect: false}] } },
            { id: 4, title: "Countable & Uncountable", desc: "Things you can count vs things you cannot count.", def: "Countable nouns can be counted with numbers. Uncountable nouns cannot be counted individually and need units.", note: "Liquids, powders, and tiny grains like rice are uncountable.", examples: { Countable: "apple, egg, chair, book", Uncountable: "water, milk, sand, rice, sugar" }, activity: { type: "choose-correct", instruction: "Is 'Milk' countable or uncountable?", options: [{word: "Uncountable", isCorrect: true}, {word: "Countable", isCorrect: false}] } },
            { id: 5, title: "Pronouns", desc: "Words used to replace nouns to avoid repetition.", def: "Pronouns are small words that take the place of a noun so you don't say the same name again and again.", note: "Use 'He' for a boy, 'She' for a girl, and 'It' for animals/objects.", examples: { Sentence: "Ali is happy. He has a bicycle.", Replaced: "The cat is sleeping. It is fat." }, activity: { type: "choose-correct", instruction: "Replace 'Siti' with a pronoun:", options: [{word: "She", isCorrect: true}, {word: "He", isCorrect: false}] } },
            { id: 6, title: "Personal Pronouns", desc: "I, You, We, They, He, She, It in action.", def: "Personal pronouns act as subjects in sentences. They tell us exactly who is doing the action.", note: "Use 'I' for yourself, 'We' when including yourself, and 'They' for a group.", examples: { Singular: "I am a pupil. He is my brother.", Plural: "We are classmates. They are playing football." }, activity: { type: "choose-correct", instruction: "____ are going to the library together. (Ali and I)", options: [{word: "We", isCorrect: true}, {word: "They", isCorrect: false}] } },
            { id: 7, title: "Possessive Pronouns", desc: "Words that show who owns something.", def: "Possessive pronouns tell you who owns an item. Words like mine, yours, his, hers, ours, and theirs.", note: "Possessive pronouns do not need an apostrophe 's'.", examples: { "My Book": "This book is mine.", "Her Pen": "That pink pen is hers.", "Our Class": "This classroom is ours." }, activity: { type: "choose-correct", instruction: "This ball belongs to you. It is ____.", options: [{word: "yours", isCorrect: true}, {word: "your", isCorrect: false}] } },
            { id: 8, title: "Verbs", desc: "Action words that tell what someone is doing.", def: "Verbs are action words. They show movement, activities, or states of being.", note: "If you can do it, it is a verb! Like run, hop, sleep, and read.", examples: { Actions: "run, swim, jump, read, write, smile", Sentences: "The boys run fast. My mother cooks curry." }, activity: { type: "tap-nouns", instruction: "Find all the action verbs!", options: [{word: "Jump", isCorrect: true}, {word: "Table", isCorrect: false}, {word: "Sleep", isCorrect: true}, {word: "Blue", isCorrect: false}, {word: "Eat", isCorrect: true}] } },
            { id: 9, title: "Simple Present Tense", desc: "Habits and things that happen regularly.", def: "Simple Present Tense is used for habits, routines, or facts happening right now.", note: "Singular helper adds 's' (He walks). Plural helper stays plain (They walk).", examples: { Everyday: "I brush my teeth daily.", Routine: "She walks to school every morning.", Facts: "The sun rises in the east." }, activity: { type: "choose-correct", instruction: "The cat ____ milk every day.", options: [{word: "drinks", isCorrect: true}, {word: "drink", isCorrect: false}] } },
            { id: 10, title: "Simple Past Tense", desc: "Actions that have already finished.", def: "Simple Past Tense describes actions that already happened yesterday, last week, or in the past.", note: "Regular verbs add '-ed' (play -> played). Irregular verbs change fully (go -> went).", examples: { Regular: "We played football yesterday.", Irregular: "Siti went to Malacca last week.", Timewords: "yesterday, last night, two days ago" }, activity: { type: "choose-correct", instruction: "He ____ an apple this morning.", options: [{word: "ate", isCorrect: true}, {word: "eat", isCorrect: false}] } },
            { id: 11, title: "Simple Future Tense", desc: "Actions that will happen later.", def: "Simple Future Tense tells about actions that will happen later or tomorrow. We use 'will' or 'going to'.", note: "Always keep the action verb plain after the word 'will'.", examples: { Plan: "I will visit my grandmother tomorrow.", Intention: "They are going to build a sandcastle." }, activity: { type: "choose-correct", instruction: "Tomorrow, we ____ have a party.", options: [{word: "will", isCorrect: true}, {word: "did", isCorrect: false}] } },
            { id: 12, title: "Adjectives", desc: "Describing words for nouns.", def: "Adjectives describe a noun's color, size, shape, number, or feelings.", note: "Adjectives make sentences sound interesting and colourful!", examples: { Appearance: "beautiful flower, tall tree, big elephant", Feelings: "happy boy, sad pup, angry giant" }, activity: { type: "choose-correct", instruction: "Identify the adjective: 'The little bird sang.'", options: [{word: "little", isCorrect: true}, {word: "bird", isCorrect: false}] } },
            { id: 13, title: "Adverbs", desc: "Words that describe how actions are done.", def: "Adverbs tell us more about a verb. They explain how, when, or where something happens.", note: "Many adverbs end with '-ly' like quickly, softly, and happily.", examples: { How: "He ran quickly. She sang softly.", When: "We will play tomorrow. I am eating now." }, activity: { type: "choose-correct", instruction: "The snail moves very ____.", options: [{word: "slowly", isCorrect: true}, {word: "slow", isCorrect: false}] } },
            { id: 14, title: "Articles: A, An & The", desc: "Special pointers before naming words.", def: "Articles specify nouns. Use 'A' for consonant sounds, 'An' for vowel sounds (a,e,i,o,u), and 'The' for specific items.", note: "Use 'An' for vowel sounds: an apple, an elephant, an hour.", examples: { "A / An": "a book, a uniform, an owl, an ice cream", "The": "The sun is hot. The headmaster spoke to us." }, activity: { type: "choose-correct", instruction: "I want to eat ____ orange.", options: [{word: "an", isCorrect: true}, {word: "a", isCorrect: false}] } },
            { id: 15, title: "Prepositions", desc: "Position words like in, on, under, behind.", def: "Prepositions tell us where something is located in relation to another object.", note: "Look at pictures to see positions: on top, inside, underneath!", examples: { Location: "The cat is under the table.", Placement: "Put the vase on the shelf.", Movement: "He walked into the classroom." }, activity: { type: "choose-correct", instruction: "The book is ____ the desk.", options: [{word: "on", isCorrect: true}, {word: "into", isCorrect: false}] } },
            { id: 16, title: "Conjunctions", desc: "Joining words like and, but, because, or.", def: "Conjunctions glue words or sentences together smoothly.", note: "Use 'and' to join, 'but' for opposites, and 'because' for reasons.", examples: { And: "I like apples and bananas.", But: "He is small but strong.", Because: "She cried because she fell down." }, activity: { type: "choose-correct", instruction: "I stayed home ____ it was raining.", options: [{word: "because", isCorrect: true}, {word: "but", isCorrect: false}] } },
            { id: 17, title: "Subject and Predicate", desc: "The who and the what of a sentence.", def: "A sentence has two parts: The Subject (who/what it is about) and the Predicate (what the subject does).", note: "The predicate always contains the main verb.", examples: { "Subject | Predicate": "The big dog | barked loudly.", "Siti | loves to bake chocolate cookies." }, activity: { type: "choose-correct", instruction: "What is the subject in: 'The teacher smiles.'", options: [{word: "The teacher", isCorrect: true}, {word: "smiles", isCorrect: false}] } },
            { id: 18, title: "Sentences", desc: "Making full statements that make complete sense.", def: "A complete sentence must make full sense on its own. It needs a subject and an action verb.", note: "A fragment is an incomplete sentence like 'running fast'.", examples: { Complete: "The pupils are studying English.", Incomplete: "under the big shady tree" }, activity: { type: "choose-correct", instruction: "Which one is a full complete sentence?", options: [{word: "Muthu goes to sleep.", isCorrect: true}, {word: "Eating an ice cream", isCorrect: false}] } },
            { id: 19, title: "Capital Letters", desc: "When to use big letters ABC.", def: "Capital letters are used at the very beginning of every sentence, for proper nouns, and the word 'I'.", note: "Days of the week and months always get capital letters!", examples: { Start: "We live here.", Proper: "My friend is Ahmad.", Calendar: "Monday, August" }, activity: { type: "choose-correct", instruction: "Which sentence uses correct capital letters?", options: [{word: "They live in Ipoh.", isCorrect: true}, {word: "they live in ipoh.", isCorrect: false}] } },
            { id: 20, title: "Punctuation Marks", desc: "Using full stops, commas, and question marks.", def: "Punctuation helps us read sentences clearly. Full stops end statements, question marks ask things.", note: "Don't forget an exclamation mark for excitement!", examples: { "Full Stop": "The sky is blue.", "Question Mark": "Where is my pencil?", "Exclamation": "Wow! That is awesome!" }, activity: { type: "choose-correct", instruction: "Choose the correct ending: 'How old are you___'", options: [{word: "?", isCorrect: true}, {word: ".", isCorrect: false}] } },
            { id: 21, title: "Question Words", desc: "Who, What, Where, When, Why, How.", def: "Question words are used at the start of a sentence to request specific information.", note: "Use 'Who' for people, 'Where' for places, and 'Why' for reasons.", examples: { Who: "Who is your teacher?", Where: "Where do you stay?", What: "What are you eating?" }, activity: { type: "choose-correct", instruction: "____ is your favorite food?", options: [{word: "What", isCorrect: true}, {word: "Who", isCorrect: false}] } },
            { id: 22, title: "Comparative Adjectives", desc: "Comparing two items using '-er' or 'more'.", def: "We use comparative adjectives to compare two people, objects, or places.", note: "Always use the word 'than' right after a comparative adjective.", examples: { Short: "An elephant is bigger than a cow.", Long: "This puzzle is more difficult than that one." }, activity: { type: "choose-correct", instruction: "A car is ____ than a bicycle.", options: [{word: "faster", isCorrect: true}, {word: "fast", isCorrect: false}] } },
            { id: 23, title: "Superlative Adjectives", desc: "Comparing three or more to find the top best.", def: "Superlative adjectives compare three or more items to show which is the highest or lowest tier.", note: "Put the word 'the' right in front of superlative words.", examples: { Short: "Ahmad is the tallest boy in Class 1A.", Long: "This is the most beautiful painting here." }, activity: { type: "choose-correct", instruction: "Mount Kinabalu is the ____ mountain in Malaysia.", options: [{word: "highest", isCorrect: true}, {word: "higher", isCorrect: false}] } },
            { id: 24, title: "Subject-Verb Agreement", desc: "Matching subjects and verbs correctly.", def: "Singular subjects take singular verbs (with an 's'). Plural subjects take plural verbs (plain).", note: "The pronouns 'I' and 'You' always follow plural verb rules!", examples: { Singular: "The bird flies high. He walks.", Plural: "The birds fly high. They walk." }, activity: { type: "choose-correct", instruction: "The pupils ____ their homework.", options: [{word: "do", isCorrect: true}, {word: "does", isCorrect: false}] } },
            { id: 25, title: "Affirmative & Negative", desc: "Saying Yes versus saying No.", def: "Affirmative sentences say YES or agree. Negative sentences say NO or disagree, using 'not'.", note: "Contractions like don't, isn't, and can't are common in negative phrases.", examples: { Affirmative: "I like ice cream. She can swim.", Negative: "I do not like ice cream. She cannot swim." }, activity: { type: "choose-correct", instruction: "Change 'He is happy' to a negative sentence:", options: [{word: "He is not happy.", isCorrect: true}, {word: "He was happy.", isCorrect: false}] } }
        ];

        // Motivational quotes array
        const QUOTES = [
            "Great learners practise every day!",
            "You can do it!",
            "Learn, practise, and improve!",
            "Every question makes you smarter!",
            "Super job! Grammar is fun!",
            "Keep pushing forward, superstar!"
        ];

        // --- SAMPLE GENERATOR FOR 20 EXERCISE QUESTIONS PER TOPIC ---
        function generateQuestionsForTopic(topicId, topicTitle) {
            let qList = [];
            const wordsPool = {
                nouns: ["school", "cat", "teacher", "pencil", "Malaysia", "book", "boy", "park", "doctor", "table"],
                verbs: ["run", "eat", "sleep", "sing", "jump", "write", "read", "swim", "fly", "dance"],
                adj: ["beautiful", "happy", "tall", "big", "little", "fast", "slow", "smart", "sad", "sweet"]
            };

            for (let i = 1; i <= 20; i++) {
                if (i % 4 === 1) {
                    qList.push({
                        text: `[Q${i}] Which word is a correct element related to ${topicTitle}?`,
                        options: [wordsPool.nouns[i%10], wordsPool.verbs[i%10], wordsPool.adj[i%10], "quickly"],
                        correct: wordsPool.nouns[i%10],
                        explanation: `${wordsPool.nouns[i%10]} fits perfectly as an example under our grammar guidelines.`
                    });
                } else if (i % 4 === 2) {
                    qList.push({
                        text: `[Q${i}] Complete this standard sentence for ${topicTitle}: 'The primary student likes the ____.'`,
                        options: ["beautifully", wordsPool.nouns[(i+2)%10], "run", "cry"],
                        correct: wordsPool.nouns[(i+2)%10],
                        explanation: `The object slot needs a proper noun structure, making '${wordsPool.nouns[(i+2)%10]}' the correct fit.`
                    });
                } else if (i % 4 === 3) {
                    qList.push({
                        text: `[Q${i}] True or False: This topic '${topicTitle}' helps us write better English sentences.`,
                        options: ["True", "False", "Not Sure", "None of the above"],
                        correct: "True",
                        explanation: "Learning grammar rules always builds strong foundation for writing skills."
                    });
                } else {
                    qList.push({
                        text: `[Q${i}] Choose the correct option that belongs to ${topicTitle}:`,
                        options: ["Jumped yesterday", wordsPool.nouns[(i+1)%10], "Slowly moving", "Under"],
                        correct: wordsPool.nouns[(i+1)%10],
                        explanation: `Based on standard exercises for ${topicTitle}, this option is accurate.`
                    });
                }
            }
            return qList;
        }

        // --- STATE MANAGEMENT ---
        let userProfile = JSON.parse(localStorage.getItem('gh_profile')) || null;
        let progressData = JSON.parse(localStorage.getItem('gh_progress')) || {
            completedLessons: [],
            scores: {}, // topicId: bestScore Percentage
            totalQuizzes: 0,
            totalAnswers: 0,
            correctAnswers: 0,
            stars: 0,
            streak: 1
        };
        let soundEnabled = localStorage.getItem('gh_sound') !== 'false';
        let currentView = 'home';
        let activeQuiz = null; // tracking active question session

        // --- AUDIO ENGINE ---
        function playSound(type) {
            if (!soundEnabled) return;
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                osc.frequency.setValueAtTime(130, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'success') {
                osc.type = 'sine';
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const oscN = ctx.createOscillator();
                    const gainN = ctx.createGain();
                    oscN.type = 'sine';
                    oscN.frequency.setValueAtTime(freq, ctx.currentTime + idx*0.1);
                    oscN.connect(gainN);
                    gainN.connect(ctx.destination);
                    gainN.gain.setValueAtTime(0.1, ctx.currentTime + idx*0.1);
                    oscN.start(ctx.currentTime + idx*0.1);
                    gainN.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx*0.1 + 0.3);
                    oscN.stop(ctx.currentTime + idx*0.1 + 0.3);
                });
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('gh_sound', soundEnabled);
            updateSoundIcon();
            playSound('click');
        }

        function updateSoundIcon() {
            const icon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                icon.className = "fas fa-volume-up";
                btn.className = "w-10 h-10 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-600 font-bold transition hover:scale-105";
            } else {
                icon.className = "fas fa-volume-mute";
                btn.className = "w-10 h-10 flex items-center justify-center rounded-full bg-slate-200 text-slate-500 font-bold transition hover:scale-105";
            }
        }

        // --- CORE NAVIGATION & APP ENGINE ---
        window.onload = function() {
            updateSoundIcon();
            if (!userProfile) {
                switchView('setup');
            } else {
                switchView('home');
            }
        };

        function saveData() {
            localStorage.setItem('gh_profile', JSON.stringify(userProfile));
            localStorage.setItem('gh_progress', JSON.stringify(progressData));
        }

        function switchView(viewName, params = {}) {
            playSound('click');
            currentView = viewName;
            const container = document.getElementById('viewContainer');
            const nav = document.getElementById('bottomNav');
            
            // Set active navigation tab state
            if (viewName === 'setup') {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
                document.querySelectorAll('nav button').forEach(b => {
                    b.classList.remove('text-indigo-600', 'bg-indigo-50');
                    b.classList.add('text-slate-400');
                });
                const activeNav = document.getElementById(`nav-${viewName}`);
                if (activeNav) {
                    activeNav.classList.remove('text-slate-400');
                    activeNav.classList.add('text-indigo-600', 'bg-indigo-50');
                }
            }

            // Router implementation
            switch(viewName) {
                case 'setup':
                    container.innerHTML = renderSetup();
                    break;
                case 'home':
                    container.innerHTML = renderHome();
                    break;
                case 'learn':
                    container.innerHTML = renderLearn();
                    break;
                case 'lesson':
                    container.innerHTML = renderLessonPage(params.id);
                    break;
                case 'practice':
                    container.innerHTML = renderPracticeZone();
                    break;
                case 'quiz':
                    container.innerHTML = renderQuizScreen(params.type, params.topicId);
                    break;

        function renderQuizScreen(type, topicId) {
            // Setup active state data structures
            let questions = [];
            let quizTitle = "Grammar Quiz";

            if (type === 'topic') {
                const topic = TOPICS.find(t => t.id === parseInt(topicId));
                quizTitle = `${topic.title} Practice`;
                questions = generateQuestionsForTopic(topic.id, topic.title);
            } else if (type === 'mixed') {
                quizTitle = "Mixed Grammar Quiz";
                // Aggregate questions
                TOPICS.slice(0, 5).forEach(t => {
                    questions = questions.concat(generateQuestionsForTopic(t.id, t.title).slice(0,2));
                });
                questions = questions.sort(() => 0.5 - Math.random()).slice(0, 10);
            } else if (type === 'quick') {
                quizTitle = "Quick Quiz Challenge";
                TOPICS.slice(0, 5).forEach(t => {
                    questions = questions.concat(generateQuestionsForTopic(t.id, t.title).slice(0,1));
                });
                questions = questions.sort(() => 0.5 - Math.random()).slice(0, 5);
            }

            activeQuiz = {
                type: type,
                topicId: topicId,
                title: quizTitle,
                questions: questions,
                currentIndex: 0,
                correctCount: 0,
                wrongCount: 0,
                hasAnswered: false
            };

            setTimeout(() => loadQuizQuestion(), 50);

            return `

        function loadQuizQuestion() {
            const q = activeQuiz.questions[activeQuiz.currentIndex];
            activeQuiz.hasAnswered = false;

            // Update header text components
            document.getElementById('quizProgressTracker').innerText = `Question ${activeQuiz.currentIndex + 1} of ${activeQuiz.questions.length}`;
            const percent = ((activeQuiz.currentIndex + 1) / activeQuiz.questions.length) * 100;
            document.getElementById('quizProgressBarFill').style.width = `${percent}%`;
            document.getElementById('quizQuestionText').innerText = q.text;

            // Hide actions elements
            document.getElementById('quizNextBtn').classList.add('hidden');
            const fBox = document.getElementById('quizFeedbackBox');
            fBox.classList.add('hidden');
            fBox.className = "p-4 rounded-2xl hidden space-y-1.5 transition-all";

            // Render choices buttons grid layout
            const grid = document.getElementById('quizOptionsGrid');
            grid.innerHTML = '';
            
            // Build choices layout with letter mapping indicators
            const labels = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 bg-white border-2 border-slate-200 text-slate-700 font-bold rounded-2xl transition text-left text-sm active:scale-98 shadow-sm flex items-center gap-3";
                btn.onclick = () => submitQuizAnswer(btn, opt);
                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-black shrink-0">${labels[idx] || ''}</span>
                    <span class="leading-tight">${opt}</span>
                `;
                grid.appendChild(btn);
            });
        }

        function submitQuizAnswer(selectedBtn, chosenText) {
            if (activeQuiz.hasAnswered) return;
            activeQuiz.hasAnswered = true;

            const q = activeQuiz.questions[activeQuiz.currentIndex];
            const fBox = document.getElementById('quizFeedbackBox');
            const nextBtn = document.getElementById('quizNextBtn');
            
            progressData.totalAnswers += 1;

            if (chosenText === q.correct) {
                activeQuiz.correctCount += 1;
                progressData.correctAnswers += 1;
                playSound('correct');
                
                selectedBtn.classList.remove('border-slate-200', 'bg-white');
                selectedBtn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                
                fBox.innerHTML = `
                    <p class="font-fun text-emerald-800 text-sm"><i class="fas fa-check-circle mr-1 text-emerald-600"></i> Correct! Well done!</p>
                    <p class="text-xs text-emerald-700 font-medium">${q.explanation}</p>
                `;
                fBox.className = "p-4 bg-emerald-50 border border-emerald-200 rounded-2xl space-y-1";
            } else {
                activeQuiz.wrongCount += 1;
                playSound('wrong');
                
                selectedBtn.classList.remove('border-slate-200', 'bg-white');
                selectedBtn.classList.add('bg-rose-100', 'text-rose-700', 'border-rose-300', 'animate-shake');
                
                // Highlight correct button target visually
                document.querySelectorAll('#quizOptionsGrid button').forEach(b => {
                    if (b.innerText.includes(q.correct)) {
                        b.classList.remove('border-slate-200', 'bg-white');
                        b.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                    }
                });

                fBox.innerHTML = `
                    <p class="font-fun text-rose-800 text-sm"><i class="fas fa-times-circle mr-1 text-rose-500"></i> Not quite. The correct answer is ${q.correct}.</p>
                    <p class="text-xs text-rose-700 font-medium">${q.explanation}</p>
                `;
                fBox.className = "p-4 bg-rose-50 border border-rose-200 rounded-2xl space-y-1";
            }

            fBox.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            saveData();
        }

        function nextQuizQuestion() {
            activeQuiz.currentIndex += 1;
            if (activeQuiz.currentIndex >= activeQuiz.questions.length) {
                // End of match, show results metrics overlay
                progressData.totalQuizzes += 1;
                const finalPercent = Math.round((activeQuiz.correctCount / activeQuiz.questions.length) * 100);
                
                // Track best scores mapping per topic
                if (activeQuiz.type === 'topic') {
                    const currentBest = progressData.scores[activeQuiz.topicId] || 0;
                    if(finalPercent > currentBest) {
                        progressData.scores[activeQuiz.topicId] = finalPercent;
                    }
                }

                // Award stars dynamically
                let starsEarned = 0;
                if(finalPercent >= 90) starsEarned = 20;
                else if (finalPercent >= 70) starsEarned = 15;
                else if (finalPercent >= 50) starsEarned = 10;
                else starsEarned = 5;

                progressData.stars += starsEarned;
                saveData();
                playSound('success');

                switchView('results', {
                    topicTitle: activeQuiz.title,
                    topicId: activeQuiz.topicId,
                    score: finalPercent,
                    correct: activeQuiz.correctCount,
                    wrong: activeQuiz.wrongCount,
                    total: activeQuiz.questions.length,
                    stars: starsEarned
                });
            } else {
                loadQuizQuestion();
            }
        }

        function renderResultsScreen(data) {
            let badgeMessage = "Keep trying! Learning takes practice.";
            let headerThemeColor = "from-amber-400 to-orange-400";
            if(data.score >= 90) {
                badgeMessage = "Excellent work! You are a Grammar Star!";
                headerThemeColor = "from-emerald-400 to-teal-500";
            } else if (data.score >= 70) {
                badgeMessage = "Great job! Keep practising to become even better!";
                headerThemeColor = "from-indigo-400 to-purple-500";
            } else if (data.score >= 50) {
                badgeMessage = "Good effort! Review the lesson and try again.";
            }

            return `
                <div class="animate-fade-in text-center space-y-6 pt-4">
                    <!-- HEADER METRIC CARD -->
                    <div class="bg-gradient-to-tr ${headerThemeColor} p-6 rounded-3xl text-white space-y-3 shadow-lg">
                        <img src="${userProfile.avatar}" class="w-16 h-16 rounded-full border-4 border-white/20 mx-auto bg-white object-cover shadow-sm">
                        <div>
                            <h2 class="font-fun text-2xl">${userProfile.name}</h2>
                            <p class="text-xs opacity-90">${data.topicTitle}</p>
                        </div>
                        
                        <div class="bg-white/10 p-4 rounded-2xl inline-block mx-auto min-w-[140px]">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-white/80 block">Score</span>
                            <span class="text-4xl font-fun">${data.score}%</span>
                        </div>
                    </div>

                    <!-- MOTIVATIONAL RESPONSE BANNER -->
                    <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                        <p class="text-sm font-bold text-slate-700 leading-tight">"${badgeMessage}"</p>
                    </div>

                    <!-- METRIC COUNTERS ROW CONTAINER -->
                    <div class="grid grid-cols-3 gap-2.5">
                        <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-2xl">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-600 block">Correct</span>
                            <span class="text-xl font-fun text-emerald-800">${data.correct}</span>
                        </div>
                        <div class="bg-rose-50 border border-rose-100 p-3 rounded-2xl">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-rose-500 block">Wrong</span>
                            <span class="text-xl font-fun text-rose-800">${data.wrong}</span>
                        </div>
                        <div class="bg-amber-50 border border-amber-100 p-3 rounded-2xl">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600 block">Stars Gifted</span>
                            <span class="text-xl font-fun text-amber-800">+${data.stars} <i class="fas fa-star text-amber-400"></i></span>
                        </div>
                    </div>

                    <!-- NAVIGATION ROUTER CONTROLS FOOTER -->
                    <div class="space-y-2 pt-2">
                        <button onclick="switchView('quiz', {type: 'topic', topicId: ${data.topicId || 1}})" class="w-full py-3.5 bg-indigo-600 text-white font-fun text-sm rounded-2xl transition active:scale-95 shadow-md shadow-indigo-100">
                            Try Again
                        </button>
                        ${data.topicId ? `
                        <button onclick="switchView('lesson', {id: ${data.topicId}})" class="w-full py-3.5 bg-slate-100 text-slate-700 font-fun text-sm rounded-2xl transition active:scale-95">
                            Review Lesson
                        </button>
                        ` : ''}
                        <button onclick="switchView('learn')" class="w-full py-3.5 bg-slate-100 text-slate-700 font-fun text-sm rounded-2xl transition active:scale-95">
                            Back to Topics
                        </button>
                        <button onclick="switchView('home')" class="w-full py-3.5 border-2 border-slate-200 text-slate-500 font-fun text-sm rounded-2xl transition active:scale-95">
                            Go Home
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProgressPage() {
            // Compute percentage and accurate scores elements metrics
            const totalTopicsCompleted = Object.keys(progressData.scores).filter(k => progressData.scores[k] >= 80).length;
            const accuracy = progressData.totalAnswers > 0 ? Math.round((progressData.correctAnswers / progressData.totalAnswers) * 100) : 0;
            
            // Generate progress bar for topics inside component panel
            let barsHTML = '';
            TOPICS.slice(0, 5).forEach(t => {
                const score = progressData.scores[t.id] || 0;
                barsHTML += `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold text-slate-600">
                            <span>${t.title}</span>
                            <span class="text-indigo-600">${score}% Complete</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-500 h-full rounded-full" style="width: ${score}%"></div>
                        </div>
                    </div>
                `;
            });

            // Badge validation logic engine parameters
            const badges = [
                { id: 'l1', name: "First Lesson Completed", icon: "fa-book-reader", color: "text-amber-500 bg-amber-50 border-amber-200", condition: progressData.completedLessons.length >= 1 },
                { id: 'q1', name: "First Quiz Completed", icon: "fa-pencil-square", color: "text-sky-500 bg-sky-50 border-sky-200", condition: progressData.totalQuizzes >= 1 },
                { id: 'gb', name: "Grammar Beginner", icon: "fa-baby", color: "text-emerald-500 bg-emerald-50 border-emerald-200", condition: progressData.correctAnswers >= 5 },
                { id: 'ge', name: "Grammar Explorer", icon: "fa-compass", color: "text-purple-500 bg-purple-50 border-purple-200", condition: progressData.correctAnswers >= 25 },
                { id: 'gc', name: "Grammar Champion", icon: "fa-crown", color: "text-rose-500 bg-rose-50 border-rose-200", condition: totalTopicsCompleted >= 3 },
                { id: 'ps', name: "Perfect Score", icon: "fa-star", color: "text-yellow-600 bg-yellow-50 border-yellow-200", condition: Object.values(progressData.scores).includes(100) },
                { id: 's3', name: "3-Day Learning Streak", icon: "fa-fire", color: "text-orange-500 bg-orange-50 border-orange-200", condition: progressData.streak >= 3 },
                { id: 's7', name: "7-Day Learning Streak", icon: "fa-bolt", color: "text-indigo-500 bg-indigo-50 border-indigo-200", condition: progressData.streak >= 7 }
            ];

            let badgesHTML = '';
            badges.forEach(b => {
                badgesHTML += `
                    <div class="p-3 border rounded-2xl flex flex-col items-center text-center gap-2 transition ${b.condition ? b.color + ' shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-300 opacity-40'}">
                        <div class="text-2xl"><i class="fas ${b.icon}"></i></div>
                        <span class="text-[10px] font-bold leading-tight">${b.name}</span>
                    </div>
                `;
            });

            return `
                <div class="animate-fade-in space-y-6">
                    <div>
                        <h2 class="text-2xl font-fun text-slate-800">My Progress Journey</h2>
                        <p class="text-xs text-slate-500">Every single practice block complete brings you closer to English fluency!</p>
                    </div>

                    <!-- STATS GRID OVERLAY PANEL -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Topics Done</span>
                            <span class="text-2xl font-fun text-slate-800">${totalTopicsCompleted}</span>
                        </div>
                        <div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Quizzes Checked</span>
                            <span class="text-2xl font-fun text-slate-800">${progressData.totalQuizzes}</span>
                        </div>
                        <div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Accuracy Rate</span>
                            <span class="text-2xl font-fun text-indigo-600">${accuracy}%</span>
                        </div>
                        <div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide block">Current Streak</span>
                            <span class="text-2xl font-fun text-orange-500">${progressData.streak} Day${progressData.streak > 1 ? 's':''}</span>
                        </div>
                    </div>

                    <!-- TOPICS PROGRESS STATUSES TRACKER PANEL -->
                    <div class="bg-white border border-slate-100 p-5 rounded-3xl shadow-sm space-y-3.5">
                        <h3 class="font-fun text-sm text-slate-700"><i class="fas fa-chart-line mr-1 text-slate-400"></i> Topic Progress Breakdown</h3>
                        <div class="space-y-3">
                            ${barsHTML}
                        </div>
                    </div>

                    <!-- ACHIEVEMENT BADGES GRID SYSTEM MODULE -->
                    <div class="space-y-3">
                        <h3 class="font-fun text-base text-slate-700 px-1"><i class="fas fa-medal mr-1 text-amber-500"></i> Achievement Badges</h3>
                        <div class="grid grid-cols-2 gap-2.5">
                            ${badgesHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProfilePage() {
            // Count total unlocked elements to print badges counter dynamically inside panel
            const totalTopicsCompleted = Object.keys(progressData.scores).filter(k => progressData.scores[k] >= 80).length;
            let earnedBadgesCount = 0;
            if(progressData.completedLessons.length >= 1) earnedBadgesCount++;
            if(progressData.totalQuizzes >= 1) earnedBadgesCount++;
            if(progressData.correctAnswers >= 5) earnedBadgesCount++;
            if(progressData.correctAnswers >= 25) earnedBadgesCount++;
            if(totalTopicsCompleted >= 3) earnedBadgesCount++;
            if(Object.values(progressData.scores).includes(100)) earnedBadgesCount++;

            return `
                <div class="animate-fade-in space-y-6 text-center pt-4">
                    <!-- AVATAR CONTAINER EDIT BOARD BLOCK -->
                    <div class="bg-white border border-slate-100 p-6 rounded-3xl shadow-sm space-y-4 max-w-sm mx-auto relative">
                        <div class="relative w-24 h-24 mx-auto">
                            <img id="profileAvatar" src="${userProfile.avatar}" class="w-24 h-24 rounded-full border-4 border-indigo-50 shadow-md bg-white object-cover">
                            <label for="profileAvatarUpload" class="absolute bottom-0 right-0 bg-indigo-600 text-white w-8 h-8 rounded-full flex items-center justify-center cursor-pointer shadow-lg active:scale-95 transition">
                                <i class="fas fa-pencil-alt text-xs"></i>
                            </label>
                            <input type="file" id="profileAvatarUpload" accept="image/*" class="hidden" onchange="handleProfileImageChange(event)">
                        </div>

                        <!-- PROFILE EDIT INDIVIDUAL ELEMENTS FORMS -->
                        <div class="space-y-3 text-left">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">Your Display Name</label>
                                <div class="flex gap-2">
                                    <input type="text" id="profileNameInput" value="${userProfile.name}" class="flex-1 px-3 py-2 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-500 transition text-sm">
                                    <button onclick="saveProfileChanges()" class="px-4 py-2 bg-indigo-600 text-white font-fun text-xs rounded-xl shadow active:scale-95 transition">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- REWARDS INSIGHT GRID CONTAINER -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-center gap-3">
                            <div class="text-3xl text-amber-500"><i class="fas fa-star"></i></div>
                            <div class="text-left">
                                <span class="text-[10px] font-bold text-amber-700 uppercase block tracking-wider">Total Stars</span>
                                <span class="text-xl font-fun text-amber-900">${progressData.stars}</span>
                            </div>
                        </div>
                        <div class="bg-purple-50 border border-purple-200 p-4 rounded-2xl flex items-center gap-3">
                            <div class="text-3xl text-purple-500"><i class="fas fa-medal"></i></div>
                            <div class="text-left">
                                <span class="text-[10px] font-bold text-purple-700 uppercase block tracking-wider">Badges Won</span>
                                <span class="text-xl font-fun text-purple-900">${earnedBadgesCount} / 8</span>
                            </div>
                        </div>
                    </div>

                    <!-- DESTRUCTIVE ACTIONS OPTIONS BOX FOOTER -->
                    <div class="bg-rose-50 border border-rose-100 p-5 rounded-3xl space-y-3 text-left">
                        <h4 class="font-fun text-rose-900 text-sm"><i class="fas fa-shield-alt mr-1"></i> Danger Zone Option</h4>
                        <p class="text-xs text-rose-700 leading-normal font-medium">Resetting your app layout clear data removes historical learning stats, best practice percentages, stars collection and custom setups permanently.</p>
                        <button onclick="openResetModal()" class="w-full py-3 bg-white border-2 border-rose-200 hover:bg-rose-100/50 text-rose-600 font-fun text-xs rounded-xl shadow-sm transition active:scale-98">
                            Reset Learning Progress
                        </button>
                    </div>
                </div>
            `;
        }

        function handleProfileImageChange(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileAvatar').src = e.target.result;
                    userProfile.avatar = e.target.result;
                    saveData();
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProfileChanges() {
            const nameIn = document.getElementById('profileNameInput').value.trim();
            if (!nameIn) {
                alert("Name can't be completely blank!");
                return;
            }
            userProfile.name = nameIn;
            saveData();
            playSound('success');
            alert("Profile settings successfully saved!");
        }

        function openResetModal() {
            playSound('click');
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function closeResetModal() {
            playSound('click');
            document.getElementById('resetModal').classList.add('hidden');
        }

        function confirmResetProgress() {
            // Flush database nodes completely
            localStorage.removeItem('gh_profile');
            localStorage.removeItem('gh_progress');
            userProfile = null;
            progressData = {
                completedLessons: [],
                scores: {},
                totalQuizzes: 0,
                totalAnswers: 0,
                correctAnswers: 0,
                stars: 0,
                streak: 1
            };
            document.getElementById('resetModal').classList.add('hidden');
            switchView('setup');
        }
    </script>
</body>
</html>
