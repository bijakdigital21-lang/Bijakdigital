<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Hub 1</title>
    <!-- Tailwind CSS v3 Play CDN - Jauh lebih stabil untuk fail HTML tunggal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for child-friendly visual elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka / Quicksand for rounded, kid-friendly typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        // Konfigurasi font tersuai untuk Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fun: ['Fredoka', 'sans-serif'],
                        sans: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F0F4F8;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom animation for wrong answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <!-- MAIN APP CONTAINER (Centered Mobile Frame) -->
    <div class="w-full max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col justify-between pb-24">
        
        <!-- Sound Toggle Floating Button -->
        <div class="absolute top-4 right-4 z-50 bg-white/80 backdrop-blur-md p-1 rounded-full shadow-md border border-slate-200">
            <button id="soundToggleBtn" onclick="toggleSound()" class="w-10 h-10 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-600 font-bold transition hover:scale-105">
                <i id="soundIcon" class="fas fa-volume-up"></i>
            </button>
        </div>

        <!-- VIEWS CONTENT INJECTION POINT -->
        <main id="viewContainer" class="flex-1 p-5 w-full">
            <!-- Dynamic pages will load here via JavaScript -->
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav id="bottomNav" class="absolute bottom-0 left-0 w-full bg-white border-t border-slate-100 shadow-2xl py-2 px-4 flex justify-between items-center z-40 rounded-t-2xl hidden">
            <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
                <i class="fas fa-house text-lg"></i>
                <span>Home</span>
            </button>
            <button onclick="switchView('learn')" id="nav-learn" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
                <i class="fas fa-book-open text-lg"></i>
                <span>Learn</span>
            </button>
            <button onclick="switchView('practice')" id="nav-practice" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
                <i class="fas fa-pencil-alt text-lg"></i>
                <span>Practice</span>
            </button>
            <button onclick="switchView('progress')" id="nav-progress" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
                <i class="fas fa-trophy text-lg"></i>
                <span>Progress</span>
            </button>
            <button onclick="switchView('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400 font-semibold text-xs py-1 px-3 rounded-xl transition-all">
                <i class="fas fa-user text-lg"></i>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- RESET CONFIRMATION MODAL -->
    <div id="resetModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-6 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 text-2xl flex items-center justify-center rounded-full mx-auto mb-4">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="font-fun text-xl text-slate-800 mb-2">Reset Progress?</h3>
            <p class="text-sm text-slate-500 mb-6">Are you sure you want to reset all your learning progress?</p>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl text-sm active:scale-95 transition">Cancel</button>
                <button onclick="confirmResetProgress()" class="flex-1 py-3 bg-rose-500 text-white font-bold rounded-2xl text-sm active:scale-95 transition shadow-lg shadow-rose-200">Reset Progress</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & CONTENT -->
    <script>
        // --- GRAMMAR DATABASE ---
        const TOPICS = [
            { id: 1, title: "Nouns", desc: "Naming words for people, places, animals, and things.", def: "A noun is a naming word. It names a person, place, animal, or thing.", note: "Remember: A noun is a naming word.", examples: { Person: "teacher, mother, Ali", Place: "school, park, Malaysia", Animal: "cat, elephant, bird", Thing: "book, pencil, table" }, activity: { type: "tap-nouns", instruction: "Tap all the nouns from the words below!", options: [{word: "Apple", isCorrect: true}, {word: "Run", isCorrect: false}, {word: "Doctor", isCorrect: true}, {word: "Happy", isCorrect: false}, {word: "Cat", isCorrect: true}, {word: "Sing", isCorrect: false}] } },
            { id: 2, title: "Common & Proper Nouns", desc: "General names vs specific unique names.", def: "Common nouns are everyday general naming words. Proper nouns are special, specific names that always start with a Capital Letter.", note: "Proper nouns always begin with a Capital Letter!", examples: { "Common Nouns": "boy, school, country, car", "Proper Nouns": "Ali, SK Taman Ceria, Malaysia, Proton Saga" }, activity: { type: "choose-correct", instruction: "Which one is a Proper Noun?", options: [{word: "Kuala Lumpur", isCorrect: true}, {word: "city", isCorrect: false}] } },
            { id: 3, title: "Singular & Plural Nouns", desc: "One item versus more than one item.", def: "Singular means only ONE. Plural means MORE THAN ONE. We usually add 's' or 'es' to plural words.", note: "Add 's' for standard plurals, and 'es' for words ending in ch, sh, x, s.", examples: { Singular: "one cat, one box, one boy", Plural: "three cats, two boxes, many boys" }, activity: { type: "choose-correct", instruction: "What is the plural of 'Bus'?", options: [{word: "Buses", isCorrect: true}, {word: "Buss", isCorrect: false}] } },
            { id: 4, title: "Countable & Uncountable", desc: "Things you can count vs things you cannot count.", def: "Countable nouns can be counted with numbers. Uncountable nouns cannot be counted individually and need units.", note: "Liquids, powders, and tiny grains like rice are uncountable.", examples: { Countable: "apple, egg, chair, book", Uncountable: "water, milk, sand, rice, sugar" }, activity: { type: "choose-correct", instruction: "Is 'Milk' countable or uncountable?", options: [{word: "Uncountable", isCorrect: true}, {word: "Countable", isCorrect: false}] } },
            { id: 5, title: "Pronouns", desc: "Words used to replace nouns to avoid repetition.", def: "Pronouns are small words that take the place of a noun so you don't say the same name again and again.", note: "Use 'He' for a boy, 'She' for a girl, and 'It' for animals/objects.", examples: { Sentence: "Ali is happy. He has a bicycle.", Replaced: "The cat is sleeping. It is fat." }, activity: { type: "choose-correct", instruction: "Replace 'Siti' with a pronoun:", options: [{word: "She", isCorrect: true}, {word: "He", isCorrect: false}] } },
            { id: 6, title: "Personal Pronouns", desc: "I, You, We, They, He, She, It in action.", def: "Personal pronouns act as subjects in sentences. They tell us exactly who is doing the action.", note: "Use 'I' for yourself, 'We' when including yourself, and 'They' for a group.", examples: { Singular: "I am a pupil. He is my brother.", Plural: "We are classmates. They are playing football." }, activity: { type: "choose-correct", instruction: "____ are going to the library together. (Ali and I)", options: [{word: "We", isCorrect: true}, {word: "They", isCorrect: false}] } },
            { id: 7, title: "Possessive Pronouns", desc: "Words that show who owns something.", def: "Possessive pronouns tell you who owns an item. Words like mine, yours, his, hers, ours, and theirs.", note: "Possessive pronouns do not need an apostrophe 's'.", examples: { "My Book": "This book is mine.", "Her Pen": "That pink pen is hers.", "Our Class": "This classroom is ours." }, activity: { type: "choose-correct", instruction: "This ball belongs to you. It is ____.", options: [{word: "yours", isCorrect: true}, {word: "your", isCorrect: false}] } },
            { id: 8, title: "Verbs", desc: "Action words that tell what someone is doing.", def: "Verbs are action words. They show movement, activities, or states of being.", note: "If you can do it, it is a verb! Like run, hop, sleep, and read.", examples: { Actions: "run, swim, jump, read, write, smile", Sentences: "The boys run fast. My mother cooks curry." }, activity: { type: "tap-nouns", instruction: "Find all the action verbs!", options: [{word: "Jump", isCorrect: true}, {word: "Table", isCorrect: false}, {word: "Sleep", isCorrect: true}, {word: "Blue", isCorrect: false}, {word: "Eat", isCorrect: true}] } },
            { id: 9, title: "Simple Present Tense", desc: "Habits and things that happen regularly.", def: "Simple Present Tense is used for habits, routines, or facts happening right now.", note: "Singular helper adds 's' (He walks). Plural helper stays plain (They walk).", examples: { Everyday: "I brush my teeth daily.", Routine: "She walks to school every morning.", Facts: "The sun rises in the east." }, activity: { type: "choose-correct", instruction: "The cat ____ milk every day.", options: [{word: "drinks", isCorrect: true}, {word: "drink", isCorrect: false}] } },
            { id: 10, title: "Simple Past Tense", desc: "Actions that have already finished.", def: "Simple Past Tense describes actions that already happened yesterday, last week, or in the past.", note: "Regular verbs add '-ed' (play -> played). Irregular verbs change fully (go -> went).", examples: { Regular: "We played football yesterday.", Irregular: "Siti went to Malacca last week.", Timewords: "yesterday, last night, two days ago" }, activity: { type: "choose-correct", instruction: "He ____ an apple this morning.", options: [{word: "ate", isCorrect: true}, {word: "eat", isCorrect: false}] } },
            { id: 11, title: "Simple Future Tense", desc: "Actions that will happen later.", def: "Simple Future Tense tells about actions that will happen later or tomorrow. We use 'will' or 'going to'.", note: "Always keep the action verb plain after the word 'will'.", examples: { Plan: "I will visit my grandmother tomorrow.", Intention: "They are going to build a sandcastle." }, activity: { type: "choose-correct", instruction: "Tomorrow, we ____ have a party.", options: [{word: "will", isCorrect: true}, {word: "did", isCorrect: false}] } },
            { id: 12, title: "Adjectives", desc: "Describing words for nouns.", def: "Adjectives describe a noun's color, size, shape, number, or feelings.", note: "Adjectives make sentences sound interesting and colourful!", examples: { Appearance: "beautiful flower, tall tree, big elephant", Feelings: "happy boy, sad pup, angry giant" }, activity: { type: "choose-correct", instruction: "Identify the adjective: 'The little bird sang.'", options: [{word: "little", isCorrect: true}, {word: "bird", isCorrect: false}] } },
            { id: 13, title: "Adverbs", desc: "Words that describe how actions are done.", def: "Adverbs tell us more about a verb. They explain how, when, or where something happens.", note: "Many adverbs end with '-ly' like quickly, softly, and happily.", examples: { How: "He ran quickly. She sang softly.", When: "We will play tomorrow. I am eating now." }, activity: { type: "choose-correct", instruction: "The snail moves very ____.", options: [{word: "slowly", isCorrect: true}, {word: "slow", isCorrect: false}] } },
            { id: 14, title: "Articles: A, An & The", desc: "Special pointers before naming words.", def: "Articles specify nouns. Use 'A' for consonant sounds, 'An' for vowel sounds (a,e,i,o,u), and 'The' for specific items.", note: "Use 'An' for vowel sounds: an apple, an elephant, an hour.", examples: { "A / An": "a book, a uniform, an owl, an ice cream", "The": "The sun is hot. The headmaster spoke to us." }, activity: { type: "choose-correct", instruction: "I want to eat ____ orange.", options: [{word: "an", isCorrect: true}, {word: "a", isCorrect: false}] } },
            { id: 15, title: "Prepositions", desc: "Position words like in, on, under, behind.", def: "Prepositions tell us where something is located in relation to another object.", note: "Look at pictures to see positions: on top, inside, underneath!", examples: { Location: "The cat is under the table.", Placement: "Put the vase on the shelf.", Movement: "He walked into the classroom." }, activity: { type: "choose-correct", instruction: "The book is ____ the desk.", options: [{word: "on", isCorrect: true}, {word: "into", isCorrect: false}] } },
            { id: 16, title: "Conjunctions", desc: "Joining words like and, but, because, or.", def: "Conjunctions glue words or sentences together smoothly.", note: "Use 'and' to join, 'but' for opposites, and 'because' for reasons.", examples: { And: "I like apples and bananas.", But: "He is small but strong.", Because: "She cried because she fell down." }, activity: { type: "choose-correct", instruction: "I stayed home ____ it was raining.", options: [{word: "because", isCorrect: true}, {word: "but", isCorrect: false}] } },
            { id: 17, title: "Subject and Predicate", desc: "The who and the what of a sentence.", def: "A sentence has two parts: The Subject (who/what it is about) and the Predicate (what the subject does).", note: "The predicate always contains the main verb.", examples: { "Subject | Predicate": "The big dog | barked loudly.", "Siti | loves to bake chocolate cookies." }, activity: { type: "choose-correct", instruction: "What is the subject in: 'The teacher smiles.'", options: [{word: "The teacher", isCorrect: true}, {word: "smiles", isCorrect: false}] } },
            { id: 18, title: "Sentences", desc: "Making full statements that make complete sense.", def: "A complete sentence must make full sense on its own. It needs a subject and an action verb.", note: "A fragment is an incomplete sentence like 'running fast'.", examples: { Complete: "The pupils are studying English.", Incomplete: "under the big shady tree" }, activity: { type: "choose-correct", instruction: "Which one is a full complete sentence?", options: [{word: "Muthu goes to sleep.", isCorrect: true}, {word: "Eating an ice cream", isCorrect: false}] } },
            { id: 19, title: "Capital Letters", desc: "When to use big letters ABC.", def: "Capital letters are used at the very beginning of every sentence, for proper nouns, and the word 'I'.", note: "Days of the week and months always get capital letters!", examples: { Start: "We live here.", Proper: "My friend is Ahmad.", Calendar: "Monday, August" }, activity: { type: "choose-correct", instruction: "Which sentence uses correct capital letters?", options: [{word: "They live in Ipoh.", isCorrect: true}, {word: "they live in ipoh.", isCorrect: false}] } },
            { id: 20, title: "Punctuation Marks", desc: "Using full stops, commas, and question marks.", def: "Punctuation helps us read sentences clearly. Full stops end statements, question marks ask things.", note: "Don't forget an exclamation mark for excitement!", examples: { "Full Stop": "The sky is blue.", "Question Mark": "Where is my pencil?", "Exclamation": "Wow! That is awesome!" }, activity: { type: "choose-correct", instruction: "Choose the correct ending: 'How old are you___'", options: [{word: "?", isCorrect: true}, {word: ".", isCorrect: false}] } },
            { id: 21, title: "Question Words", desc: "Who, What, Where, When, Why, How.", def: "Question words are used at the start of a sentence to request specific information.", note: "Use 'Who' for people, 'Where' for places, and 'Why' for reasons.", examples: { Who: "Who is your teacher?", Where: "Where do you stay?", What: "What are you eating?" }, activity: { type: "choose-correct", instruction: "____ is your favorite food?", options: [{word: "What", isCorrect: true}, {word: "Who", isCorrect: false}] } },
            { id: 22, title: "Comparative Adjectives", desc: "Comparing two items using '-er' or 'more'.", def: "We use comparative adjectives to compare two people, objects, or places.", note: "Always use the word 'than' right after a comparative adjective.", examples: { Short: "An elephant is bigger than a cow.", Long: "This puzzle is more difficult than that one." }, activity: { type: "choose-correct", instruction: "A car is ____ than a bicycle.", options: [{word: "faster", isCorrect: true}, {word: "fast", isCorrect: false}] } },
            { id: 23, title: "Superlative Adjectives", desc: "Comparing three or more to find the top best.", def: "Superlative adjectives compare three or more items to show which is the highest or lowest tier.", note: "Put the word 'the' right in front of superlative words.", examples: { Short: "Ahmad is the tallest boy in Class 1A.", Long: "This is the most beautiful painting here." }, activity: { type: "choose-correct", instruction: "Mount Kinabalu is the ____ mountain in Malaysia.", options: [{word: "highest", isCorrect: true}, {word: "higher", isCorrect: false}] } },
            { id: 24, title: "Subject-Verb Agreement", desc: "Matching subjects and verbs correctly.", def: "Singular subjects take singular verbs (with an 's'). Plural subjects take plural verbs (plain).", note: "The pronouns 'I' and 'You' always follow plural verb rules!", examples: { Singular: "The bird flies high. He walks.", Plural: "The birds fly high. They walk." }, activity: { type: "choose-correct", instruction: "The pupils ____ their homework.", options: [{word: "do", isCorrect: true}, {word: "does", isCorrect: false}] } },
            { id: 25, title: "Affirmative & Negative", desc: "Saying Yes versus saying No.", def: "Affirmative sentences say YES or agree. Negative sentences say NO or disagree, using 'not'.", note: "Contractions like don't, isn't, and can't are common in negative phrases.", examples: { Affirmative: "I like ice cream. She can swim.", Negative: "I do not like ice cream. She cannot swim." }, activity: { type: "choose-correct", instruction: "Change 'He is happy' to a negative sentence:", options: [{word: "He is not happy.", isCorrect: true}, {word: "He was happy.", isCorrect: false}] } }
        ];

        const QUOTES = [
            "Great learners practise every day!",
            "You can do it!",
            "Learn, practise, and improve!",
            "Every question makes you smarter!"
        ];

        // --- QUESTION POOL FOR PRACTICE ---
        function generateQuestionsForTopic(topicId, topicTitle) {
            let qList = [];
            const mockWords = ["school", "cat", "teacher", "pencil", "Malaysia", "book", "boy", "park", "doctor", "table"];
            for (let i = 1; i <= 20; i++) {
                qList.push({
                    text: `Which option is a correct example or rule under the topic: "${topicTitle}"? (Question ${i})`,
                    options: [mockWords[i % 10], "runs fast", "beautifully", "happily"],
                    correct: mockWords[i % 10],
                    explanation: `${mockWords[i % 10]} is an essential example related to ${topicTitle}.`
                });
            }
            return qList;
        }

        // --- STATE MANAGEMENT ---
        let userProfile = JSON.parse(localStorage.getItem('gh_profile')) || null;
        let progressData = JSON.parse(localStorage.getItem('gh_progress')) || {
            completedLessons: [],
            scores: {},
            totalQuizzes: 0,
            totalAnswers: 0,
            correctAnswers: 0,
            stars: 0,
            streak: 3
        };
        let soundEnabled = localStorage.getItem('gh_sound') !== 'false';
        let activeQuiz = null;

        // --- AUDIO ENGINE ---
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch(e) { console.log("Audio not supported yet."); }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('gh_sound', soundEnabled);
            updateSoundIcon();
            playSound('click');
        }

        function updateSoundIcon() {
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = "fas fa-volume-up";
            } else {
                icon.className = "fas fa-volume-mute text-slate-400";
            }
        }

        // --- APP WORKFLOW CONTROLLER ---
        window.onload = function() {
            updateSoundIcon();
            if (!userProfile) {
                switchView('setup');
            } else {
                switchView('home');
            }
        };

        function saveData() {
            localStorage.setItem('gh_profile', JSON.stringify(userProfile));
            localStorage.setItem('gh_progress', JSON.stringify(progressData));
        }

        function switchView(viewName, params = {}) {
            playSound('click');
            const container = document.getElementById('viewContainer');
            const nav = document.getElementById('bottomNav');
            
            if (viewName === 'setup') {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
                document.querySelectorAll('nav button').forEach(b => {
                    b.classList.remove('text-indigo-600', 'bg-indigo-50');
                    b.classList.add('text-slate-400');
                });
                const activeNav = document.getElementById(`nav-${viewName}`);
                if (activeNav) {
                    activeNav.classList.add('text-indigo-600', 'bg-indigo-50');
                }
            }

            switch(viewName) {
                case 'setup': container.innerHTML = renderSetup(); break;
                case 'home': container.innerHTML = renderHome(); break;
                case 'learn': container.innerHTML = renderLearn(); break;
                case 'lesson': container.innerHTML = renderLessonPage(params.id); break;
                case 'practice': container.innerHTML = renderPracticeZone(); break;
                case 'quiz': container.innerHTML = renderQuizScreen(params.type, params.topicId); break;
                case 'results': container.innerHTML = renderResultsScreen(params); break;
                case 'progress': container.innerHTML = renderProgressPage(); break;
                case 'profile': container.innerHTML = renderProfilePage(); break;
            }
            window.scrollTo(0,0);
        }

        // --- UI RENDER TEMPLATES ---
        function renderSetup() {
            return `
                <div class="flex flex-col items-center justify-center pt-12 text-center">
                    <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-3xl flex items-center justify-center text-white text-3xl shadow-lg mb-6">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h1 class="text-3xl text-slate-800 font-fun font-bold mb-2">Welcome to<br><span class="text-indigo-600">Grammar Hub 1!</span></h1>
                    <p class="text-slate-500 text-sm max-w-xs mb-8">Create your learning profile and start improving your grammar.</p>
                    
                    <div class="w-full space-y-6 bg-slate-50 p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div class="flex flex-col items-center gap-3">
                            <div class="relative">
                                <img id="setupAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=GrammarHub" class="w-24 h-24 rounded-full bg-white border-4 border-white shadow-md" alt="Avatar">
                                <label for="avatarUpload" class="absolute bottom-0 right-0 bg-indigo-600 text-white w-8 h-8 rounded-full flex items-center justify-center cursor-pointer shadow-md">
                                    <i class="fas fa-camera text-xs"></i>
                                </label>
                                <input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </div>
                        </div>

                        <div class="text-left">
                            <label class="block text-sm font-bold text-slate-600 mb-2">Enter your name:</label>
                            <input type="text" id="setupName" placeholder="Your Name" class="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-2xl font-semibold text-slate-700 placeholder-slate-400 focus:outline-none focus:border-indigo-500">
                        </div>

                        <button onclick="submitSetup()" class="w-full py-4 bg-indigo-600 text-white font-fun font-bold text-lg rounded-2xl shadow-lg">
                            Start Learning <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('setupAvatar').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function submitSetup() {
            const nameInput = document.getElementById('setupName').value.trim();
            if (!nameInput) {
                alert("Please enter your name!");
                return;
            }
            userProfile = {
                name: nameInput,
                avatar: document.getElementById('setupAvatar').src
            };
            saveData();
            switchView('home');
        }

        function renderHome() {
            const randQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between bg-gradient-to-r from-indigo-500 to-purple-600 p-5 rounded-3xl shadow-xl text-white">
                        <div>
                            <p class="text-indigo-100 text-xs font-bold uppercase tracking-wide">Hello, 👋</p>
                            <h2 class="text-2xl font-fun font-bold">${userProfile.name}!</h2>
                        </div>
                        <img src="${userProfile.avatar}" class="w-14 h-14 rounded-full border-2 border-white/50 bg-white object-cover">
                    </div>

                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-center gap-3">
                        <p class="text-sm font-semibold text-amber-800 italic">"${randQuote}"</p>
                    </div>

                    <div class="space-y-3">
                        <h3 class="text-lg font-fun font-bold text-slate-800">Let's Learn Grammar!</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div onclick="switchView('learn')" class="bg-emerald-50 p-4 rounded-3xl border border-emerald-100 flex flex-col items-start gap-3 cursor-pointer">
                                <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-lg"><i class="fas fa-book"></i></div>
                                <h4 class="font-fun font-bold text-emerald-900 text-sm">Learn Grammar</h4>
                            </div>
                            <div onclick="switchView('practice')" class="bg-sky-50 p-4 rounded-3xl border border-sky-100 flex flex-col items-start gap-3 cursor-pointer">
                                <div class="w-10 h-10 rounded-xl bg-sky-500 text-white flex items-center justify-center text-lg"><i class="fas fa-pencil-alt"></i></div>
                                <h4 class="font-fun font-bold text-sky-900 text-sm">Practice Zone</h4>
                            </div>
                            <div onclick="switchView('progress')" class="bg-indigo-50 p-4 rounded-3xl border border-indigo-100 flex flex-col items-start gap-3 cursor-pointer">
                                <div class="w-10 h-10 rounded-xl bg-indigo-500 text-white flex items-center justify-center text-lg"><i class="fas fa-trophy"></i></div>
                                <h4 class="font-fun font-bold text-indigo-900 text-sm">My Progress</h4>
                            </div>
                            <div onclick="switchView('profile')" class="bg-purple-50 p-4 rounded-3xl border border-purple-100 flex flex-col items-start gap-3 cursor-pointer">
                                <div class="w-10 h-10 rounded-xl bg-purple-500 text-white flex items-center justify-center text-lg"><i class="fas fa-user"></i></div>
                                <h4 class="font-fun font-bold text-purple-900 text-sm">My Profile</h4>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLearn() {
            let listHTML = '';
            TOPICS.forEach(topic => {
                const isCompleted = progressData.completedLessons.includes(topic.id);
                const score = progressData.scores[topic.id] || 0;
                let statusText = isCompleted ? "Learning" : "Not Started";
                let statusClass = isCompleted ? "bg-amber-100 text-amber-700" : "bg-slate-100 text-slate-600";
                
                if (score >= 80) {
                    statusText = "Completed";
                    statusClass = "bg-emerald-100 text-emerald-700";
                }

                listHTML += `
                    <div class="bg-white border border-slate-200 p-4 rounded-2xl space-y-3">
                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-xs font-bold text-indigo-500">Topic ${topic.id}</span>
                                <h4 class="font-fun font-bold text-base text-slate-800">${topic.title}</h4>
                            </div>
                            <span class="text-[11px] px-2.5 py-1 font-bold rounded-full ${statusClass}">${statusText}</span>
                        </div>
                        <p class="text-xs text-slate-500">${topic.desc}</p>
                        <button onclick="switchView('lesson', {id: ${topic.id}})" class="w-full py-2 bg-indigo-600 text-white font-fun text-xs font-bold rounded-xl shadow-sm">
                            ${isCompleted ? 'Review' : 'Learn Now'}
                        </button>
                    </div>
                `;
            });
            return `<div class="space-y-4"><div><h2 class="text-2xl font-fun font-bold text-slate-800">Grammar Library</h2></div><div class="space-y-3">${listHTML}</div></div>`;
        }

        function renderLessonPage(id) {
            const topic = TOPICS.find(t => t.id === parseInt(id));
            let examplesHTML = '';
            for (const [key, val] of Object.entries(topic.examples)) {
                examplesHTML += `<div class="bg-white p-3 rounded-xl border border-slate-200"><span class="text-xs font-bold text-purple-600 block mb-1">${key}</span><p class="text-sm font-semibold text-slate-700">${val}</p></div>`;
            }

            let optionsHTML = '';
            topic.activity.options.forEach(opt => {
                optionsHTML += `<button onclick="checkMiniActivity(this, ${opt.isCorrect})" class="p-3 bg-white border-2 border-slate-200 text-slate-700 font-bold rounded-xl text-xs">${opt.word}</button>`;
            });

            return `
                <div class="space-y-5">
                    <div class="flex items-center gap-3">
                        <button onclick="switchView('learn')" class="w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center"><i class="fas fa-arrow-left text-sm"></i></button>
                        <h2 class="text-xl font-fun font-bold text-slate-800">Topic ${topic.id}: ${topic.title}</h2>
                    </div>
                    <div class="bg-indigo-50 p-4 rounded-2xl"><h4 class="font-fun font-bold text-indigo-900 mb-1">Definition</h4><p class="text-sm text-indigo-950 font-medium">${topic.def}</p></div>
                    <div class="space-y-2"><h4 class="font-fun font-bold text-slate-800">Examples</h4>${examplesHTML}</div>
                    <div class="bg-amber-50 p-4 rounded-2xl text-xs font-semibold text-amber-900">⚠️ ${topic.note}</div>
                    
                    <div class="bg-indigo-900 p-4 rounded-2xl text-white space-y-3">
                        <div class="flex justify-between items-center"><span class="text-[10px] font-bold bg-white/20 px-2 py-0.5 rounded-full uppercase">Mini Activity</span><span id="miniActivityFeedback" class="text-xs font-bold text-emerald-300"></span></div>
                        <h4 class="font-fun text-sm">${topic.activity.instruction}</h4>
                        <div class="grid grid-cols-3 gap-2">${optionsHTML}</div>
                    </div>

                    <button id="lessonPracticeBtn" onclick="completeLessonAndStartPractice(${topic.id})" class="w-full py-4 bg-emerald-500 text-white font-fun font-bold text-lg rounded-2xl opacity-50 shadow-md">Start Practice</button>
                </div>
            `;
        }

        function checkMiniActivity(btn, isCorrect) {
            const feedbackSpan = document.getElementById('miniActivityFeedback');
            if (isCorrect) {
                playSound('correct');
                btn.className = "p-3 bg-emerald-500 text-white font-bold rounded-xl text-xs";
                feedbackSpan.innerText = "Correct! 🎉";
                document.getElementById('lessonPracticeBtn').classList.remove('opacity-50');
            } else {
                playSound('wrong');
                btn.classList.add('animate-shake', 'bg-rose-500', 'text-white');
                feedbackSpan.innerText = "Try again!";
                setTimeout(() => btn.classList.remove('animate-shake'), 300);
            }
        }

        function completeLessonAndStartPractice(topicId) {
            if (document.getElementById('lessonPracticeBtn').classList.contains('opacity-50')) {
                alert("Please complete the mini activity game first!");
                return;
            }
            if(!progressData.completedLessons.includes(topicId)) {
                progressData.completedLessons.push(topicId);
                progressData.stars += 5;
                saveData();
            }
            switchView('quiz', {type: 'topic', topicId: topicId});
        }

        function renderPracticeZone() {
            let listHTML = '';
            TOPICS.forEach(t => {
                const isUnlocked = progressData.completedLessons.includes(t.id);
                listHTML += `
                    <div onclick="${isUnlocked ? `switchView('quiz', {type: 'topic', topicId: ${t.id}})` : `alert('Please unlock this topic from the Learn screen first!')`}" class="p-4 bg-white border border-slate-200 rounded-xl flex items-center justify-between cursor-pointer ${!isUnlocked ? 'opacity-50' : ''}">
                        <div><span class="text-[10px] text-slate-400 font-bold block">TOPIC ${t.id}</span><span class="font-fun font-bold text-slate-700 text-sm">${t.title}</span></div>
                        <i class="fas ${isUnlocked ? 'fa-play text-emerald-500' : 'fa-lock text-slate-400'} text-xs"></i>
                    </div>
                `;
            });
            return `
                <div class="space-y-4">
                    <div onclick="switchView('quiz', {type: 'mixed'})" class="p-4 bg-gradient-to-r from-orange-400 to-amber-500 rounded-2xl text-white cursor-pointer"><h3 class="font-fun font-bold">Mixed Grammar Quiz</h3><p class="text-xs opacity-90">10 Random combined questions</p></div>
                    <div onclick="switchView('quiz', {type: 'quick'})" class="p-4 bg-gradient-to-r from-purple-500 to-indigo-600 rounded-2xl text-white cursor-pointer"><h3 class="font-fun font-bold">Quick Quiz</h3><p class="text-xs opacity-90">5 Swift Blitz questions</p></div>
                    <div class="space-y-2"><h3 class="font-fun font-bold text-slate-700">Practice by Topic</h3>${listHTML}</div>
                </div>
            `;
        }

        function renderQuizScreen(type, topicId) {
            let questions = [];
            let title = "Mixed Quiz";
            if(type === 'topic') {
                const t = TOPICS.find(topic => topic.id == topicId);
                title = `${t.title} Quiz`;
                questions = generateQuestionsForTopic(t.id, t.title);
            } else {
                TOPICS.slice(0, 4).forEach(t => { questions = questions.concat(generateQuestionsForTopic(t.id, t.title).slice(0, 3)); });
                questions = questions.sort(() => 0.5 - Math.random()).slice(0, type === 'quick' ? 5 : 10);
            }

            activeQuiz = { type, topicId, title, questions, currentIndex: 0, correctCount: 0, wrongCount: 0, hasAnswered: false };
            setTimeout(() => loadQuestion(), 50);

            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center"><h3 class="font-fun font-bold text-slate-700">${title}</h3><span id="qCount" class="text-xs font-bold text-slate-400"></span></div>
                    <div class="bg-slate-50 p-5 rounded-2xl text-center border border-slate-200 min-h-[100px] flex items-center justify-center"><p id="qText" class="font-fun font-bold text-slate-800"></p></div>
                    <div id="qOptions" class="space-y-2"></div>
                    <div id="qFeedback" class="p-4 rounded-xl hidden text-xs font-semibold"></div>
                    <button id="qNext" onclick="nextQuestion()" class="w-full py-4 bg-indigo-600 text-white font-fun font-bold rounded-2xl hidden">Next Question</button>
                </div>
            `;
        }

        function loadQuestion() {
            const q = activeQuiz.questions[activeQuiz.currentIndex];
            activeQuiz.hasAnswered = false;
            document.getElementById('qCount').innerText = `Question ${activeQuiz.currentIndex + 1} of ${activeQuiz.questions.length}`;
            document.getElementById('qText').innerText = q.text;
            document.getElementById('qNext').classList.add('hidden');
            document.getElementById('qFeedback').classList.add('hidden');

            const optDiv = document.getElementById('qOptions');
            optDiv.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3.5 bg-white border-2 border-slate-200 text-slate-700 font-bold rounded-xl text-left text-sm shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                optDiv.appendChild(btn);
            });
        }

        function checkAnswer(btn, chosen) {
            if (activeQuiz.hasAnswered) return;
            activeQuiz.hasAnswered = true;
            const q = activeQuiz.questions[activeQuiz.currentIndex];
            const feed = document.getElementById('qFeedback');
            feed.classList.remove('hidden');
            document.getElementById('qNext').classList.remove('hidden');
            progressData.totalAnswers++;

            if(chosen === q.correct) {
                playSound('correct');
                activeQuiz.correctCount++;
                progressData.correctAnswers++;
                btn.className = "w-full p-3.5 bg-emerald-500 text-white font-bold rounded-xl text-left text-sm";
                feed.className = "p-4 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-xl text-xs font-semibold";
                feed.innerText = `Correct! Well done! \n${q.explanation}`;
            } else {
                playSound('wrong');
                activeQuiz.wrongCount++;
                btn.className = "w-full p-3.5 bg-rose-500 text-white font-bold rounded-xl text-left text-sm";
                feed.className = "p-4 bg-rose-50 text-rose-800 border border-rose-200 rounded-xl text-xs font-semibold";
                feed.innerText = `Not quite. The correct answer is: ${q.correct}. \n${q.explanation}`;
            }
            saveData();
        }

        function nextQuestion() {
            activeQuiz.currentIndex++;
            if(activeQuiz.currentIndex >= activeQuiz.questions.length) {
                progressData.totalQuizzes++;
                const finalPercent = Math.round((activeQuiz.correctCount / activeQuiz.questions.length) * 100);
                if(activeQuiz.type === 'topic') {
                    progressData.scores[activeQuiz.topicId] = Math.max(progressData.scores[activeQuiz.topicId] || 0, finalPercent);
                }
                let stars = finalPercent >= 80 ? 20 : 10;
                progressData.stars += stars;
                saveData();
                switchView('results', { title: activeQuiz.title, score: finalPercent, correct: activeQuiz.correctCount, wrong: activeQuiz.wrongCount, stars });
            } else {
                loadQuestion();
            }
        }

        function renderResultsScreen(d) {
            return `
                <div class="text-center space-y-5 pt-6">
                    <div class="bg-indigo-600 p-6 rounded-3xl text-white">
                        <h2 class="text-3xl font-fun font-bold">${d.score}%</h2>
                        <p class="text-sm opacity-90">${d.title} Completed!</p>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                        <div class="p-3 bg-emerald-50 border rounded-xl text-emerald-700">Correct: ${d.correct}</div>
                        <div class="p-3 bg-rose-50 border rounded-xl text-rose-700">Wrong: ${d.wrong}</div>
                        <div class="p-3 bg-amber-50 border rounded-xl text-amber-700">+${d.stars} ⭐</div>
                    </div>
                    <button onclick="switchView('practice')" class="w-full py-3 bg-indigo-600 text-white font-fun font-bold rounded-xl shadow-md">Back to Practice Zone</button>
                </div>
            `;
        }

        function renderProgressPage() {
            const accuracy = progressData.totalAnswers > 0 ? Math.round((progressData.correctAnswers / progressData.totalAnswers) * 100) : 0;
            return `
                <div class="space-y-4">
                    <h2 class="text-xl font-fun font-bold text-slate-800">My Progress</h2>
                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="p-4 bg-white border rounded-2xl shadow-sm"><span class="text-xs text-slate-400 block font-bold">QUIZZES DONE</span><span class="text-2xl font-fun font-bold text-slate-800">${progressData.totalQuizzes}</span></div>
                        <div class="p-4 bg-white border rounded-2xl shadow-sm"><span class="text-xs text-slate-400 block font-bold">ACCURACY</span><span class="text-2xl font-fun font-bold text-indigo-600">${accuracy}%</span></div>
                    </div>
                </div>
            `;
        }

        function renderProfilePage() {
            return `
                <div class="text-center space-y-4 pt-6">
                    <img src="${userProfile.avatar}" class="w-24 h-24 rounded-full mx-auto border-4 border-slate-200">
                    <h3 class="text-xl font-fun font-bold text-slate-800">${userProfile.name}</h3>
                    <div class="bg-amber-100 text-amber-900 p-3 rounded-xl font-bold text-sm">⭐ ${progressData.stars} Total Stars Collected</div>
                    <button onclick="openResetModal()" class="w-full py-3 bg-rose-100 text-rose-600 font-fun font-bold text-xs rounded-xl">Reset Progress Data</button>
                </div>
            `;
        }

        function openResetModal() { document.getElementById('resetModal').classList.remove('hidden'); }
        function closeResetModal() { document.getElementById('resetModal').classList.add('hidden'); }
        function confirmResetProgress() {
            localStorage.clear();
            userProfile = null;
            progressData = { completedLessons: [], scores: {}, totalQuizzes: 0, totalAnswers: 0, correctAnswers: 0, stars: 0, streak: 1 };
            closeResetModal();
            switchView('setup');
        }
    </script>
</body>
</html>
