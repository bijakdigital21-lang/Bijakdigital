        // --- 4. ENGINE AUDIO DINAMIK (WEB AUDIO API) ---
        function playSound(type) {
            if (!userProfile.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
                    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                }
            } catch (e) { console.log("Audio error context:", e); }
        }

            const data = localStorage.getItem('grammar_hub_1_profile');
            if (data) {
                userProfile = JSON.parse(data);
                // Fail-safe checks untuk object progress lama
                if (!userProfile.progress) userProfile.progress = {};
                topicsData.forEach(t => {
                    if (!userProfile.progress[t.id]) {
                        userProfile.progress[t.id] = { learned: false, highestScore: 0, status: 'Not Started' };
                    }

            }
        }

            const appNode = document.getElementById('app');
            if (userProfile.darkMode) {
                document.body.classList.add('bg-slate-900');
                appNode.classList.add('bg-slate-800', 'text-white');
                appNode.classList.remove('bg-white', 'text-slate-800');
            } else {
                document.body.classList.remove('bg-slate-900');
                appNode.classList.add('bg-white', 'text-slate-800');
                appNode.classList.remove('bg-slate-800', 'text-white');

            let totalTopics = topicsData.length;

            topicsData.forEach(t => {
                if (userProfile.progress[t.id] && userProfile.progress[t.id].status === 'Completed') {

            });
            return Math.round((finishedCount / totalTopics) * 100);

        // 6.5 INTERACTIVE QUIZ SYSTEM
        function startQuiz(topicId) {
            playSound('click');
            const topic = topicsData.find(t => t.id === topicId);
            
            // Shallow copy questions array dan rawak soalan
            let qList = [...topic.questions];
            qList = qList.sort(() => Math.random() - 0.5);

            currentQuiz.topicId = topicId;
            currentQuiz.questions = qList;
            currentQuiz.currentIndex = 0;
            currentQuiz.score = 0;
            currentQuiz.correctCount = 0;
            currentQuiz.wrongCount = 0;

            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            hideNavbar(); // Tutup navigasi semasa kuiz untuk kosentrasi penuh
            const main = document.getElementById('main-content');
            const totalQ = currentQuiz.questions.length;
            const curIndex = currentQuiz.currentIndex;
            const qObj = currentQuiz.questions[curIndex];
            
            const progressPercent = Math.round(((curIndex) / totalQ) * 100);

            main.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-500">${getTranslation('quiz_q')} ${curIndex + 1} / ${totalQ}</span>
                    <span class="text-xs font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded-md">${getTranslation('quiz_score')}: ${currentQuiz.score}</span>
                </div>

                <!-- PROGRESS BAR KUIZ -->
                <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-5">
                    <div class="bg-orange-500 h-full transition-all" style="width: ${progressPercent}%"></div>
                </div>

                <div class="bg-white border-2 border-orange-300 rounded-3xl p-5 shadow-sm space-y-4 mb-4">
                    <div class="text-center p-3 bg-orange-50 rounded-2xl mb-2">
                        <h4 class="text-lg font-bold text-slate-800 leading-tight">${qObj.q}</h4>
                    </div>

                    <div id="quiz-options-container" class="space-y-2">
                        <!-- Pilihan jawapan diisi mengikut jenis format soalan -->
                    </div>
                </div>

                <div id="quiz-feedback-box" class="hidden p-4 rounded-2xl mb-4 text-sm font-medium"></div>

                <button id="quiz-next-btn" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-md custom-bounce transition">
                    ${getTranslation('quiz_next_q')} <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            `;

            const optContainer = document.getElementById('quiz-options-container');

            if (qObj.type === 'choice') {
                const choices = [
                    {key: 'a', val: qObj.a}, {key: 'b', val: qObj.b},
                    {key: 'c', val: qObj.c}, {key: 'd', val: qObj.d}
                ];
                optContainer.innerHTML = choices.filter(c => c.val).map(c => `
                    <button onclick="submitQuizAnswer('${c.key}')" class="quiz-opt-btn w-full text-left p-3.5 bg-slate-50 hover:bg-slate-100 border-2 border-slate-200 rounded-xl font-bold text-slate-700 transition flex items-center gap-3">
                        <span class="w-7 h-7 bg-white border border-slate-300 text-slate-400 rounded-md flex items-center justify-center text-xs uppercase font-extrabold">${c.key}</span>
                        <span>${c.val}</span>
                    </button>
                `).join('');
            } else if (qObj.type === 'tf') {
                optContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="submitQuizAnswer('true')" class="quiz-opt-btn p-4 bg-green-50 hover:bg-green-100 border-2 border-green-200 rounded-2xl font-bold text-green-700 text-center transition">TRUE</button>
                        <button onclick="submitQuizAnswer('false')" class="quiz-opt-btn p-4 bg-red-50 hover:bg-red-100 border-2 border-red-200 rounded-2xl font-bold text-red-700 text-center transition">FALSE</button>
                    </div>
                `;
            } else if (qObj.type === 'blank') {
                // Ekstrak pilihan jika soalan mempunyai struktur (pilihan1 / pilihan2)
                const match = qObj.q.match(/\(([^)]+)\)/);
                if (match && match[1]) {
                    const parts = match[1].split('/').map(p => p.trim());
                    optContainer.innerHTML = `
                        <div class="grid grid-cols-2 gap-3">
                            ${parts.map(p => `
                                <button onclick="submitQuizAnswer('${p}')" class="quiz-opt-btn p-3.5 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-xl font-bold text-blue-700 text-center transition">${p}</button>
                            `).join('')}
                        </div>
                    `;
                } else {
                    optContainer.innerHTML = `
                        <input type="text" id="blank-input" class="w-full p-3 border-2 border-slate-300 rounded-xl text-center font-bold text-lg" placeholder="Taip jawapan di sini...">
                        <button onclick="submitQuizAnswer(document.getElementById('blank-input').value.trim())" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold mt-2">Hantar Jawapan</button>
                    `;
                }
            }
        }

        function submitQuizAnswer(chosen) {
            const qObj = currentQuiz.questions[currentQuiz.currentIndex];
            const isCorrect = chosen.toLowerCase() === qObj.ans.toLowerCase();
            
            // Matikan butang pilihan supaya tidak boleh tekan dua kali
            document.querySelectorAll('.quiz-opt-btn').forEach(b => b.disabled = true);

            const feedbackBox = document.getElementById('quiz-feedback-box');
            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                playSound('correct');
                currentQuiz.score += 10;
                currentQuiz.correctCount++;
                feedbackBox.className = "p-4 rounded-2xl mb-4 text-sm font-medium bg-green-100 text-green-800 border border-green-300";
                feedbackBox.innerHTML = `
                    <div class="flex items-center gap-2 font-bold mb-1"><i class="fa-solid fa-circle-check text-lg"></i> Hebat! Jawapan Betul.</div>
                    <p class="text-xs opacity-90"><b class="block">${getTranslation('quiz_explanation')}</b> ${qObj.exp}</p>
                `;
            } else {
                playSound('wrong');
                currentQuiz.wrongCount++;
                feedbackBox.className = "p-4 rounded-2xl mb-4 text-sm font-medium bg-red-100 text-red-800 border border-red-300";
                feedbackBox.innerHTML = `
                    <div class="flex items-center gap-2 font-bold mb-1"><i class="fa-solid fa-circle-xmark text-lg"></i> Alamak, Kurang Tepat!</div>
                    <p class="text-xs mb-1"><b>${getTranslation('quiz_correct_ans')}</b> <span class="bg-white px-2 py-0.5 rounded text-red-600 font-bold border border-red-200">${qObj.ans}</span></p>
                    <p class="text-xs opacity-90"><b>${getTranslation('quiz_explanation')}</b> ${qObj.exp}</p>
                `;
            }

            document.getElementById('quiz-next-btn').classList.remove('hidden');
            document.getElementById('quiz-next-btn').onclick = () => {
                currentQuiz.currentIndex++;
                if (currentQuiz.currentIndex < currentQuiz.questions.length) {
                    renderQuizQuestion();
                } else {
                    finishQuizAndShowResults();
                }
            };
        }

        // 6.6 RESULTS PAGE

            else if (percent >= 50) { starsEarned = 3; msg = "Good try! Let’s practise again! 👍"; }

            // Simpan data kedalam profile
            userProfile.totalStars += starsEarned;
            if (percent > userProfile.progress[topicId].highestScore) {
                userProfile.progress[topicId].highestScore = percent;

            saveToLocalStorage();

            const main = document.getElementById('main-content');

                            ${Array(5).fill(null).map((_, i) => `<i class="fa-solid fa-star ${i < starsEarned ? 'text-yellow-300 scale-110 animate-pulse' : 'text-orange-200/50'}"></i>`).join('')}

                    <!-- RINGKASAN SKOR -->

                        <div class="bg-green-50 p-3 rounded-xl border border-green-200">

                            <span class="text-[10px] text-red-400 font-bold block uppercase">${getTranslation('res_wrong')}</span>
                        </div>
                    </div>

                    <div class="bg-blue-50 p-3 rounded-xl flex items-center justify-center gap-2 text-blue-800 font-bold border border-blue-200 text-sm">
                        <i class="fa-solid fa-gift text-lg text-yellow-500"></i> +${starsEarned} ${getTranslation('res_stars')}!
                    </div>

                    <!-- STRUKTUR BUTANG NAVIGASI KEPUTUSAN -->
                    <div class="space-y-2 pt-2">

                userProfile.lang = e.target.value;
                saveToLocalStorage();
                changeTab('settings'); // Muat semula halaman tetapan bahasa terkini
            });

            // Global helpers bagi memudahkan panggilan onclick dinamik inline
            window.triggerProfileEdit = () => { renderRegisterPage(); };

            window.resetProgressData = () => {
                if (confirm(getTranslation('confirm_reset'))) {
                    topicsData.forEach(t => {
                        userProfile.progress[t.id] = { learned: false, highestScore: 0, status: 'Not Started' };
                    });
                    userProfile.totalStars = 0;
                    saveToLocalStorage();
                    alert("Kemajuan dikosongkan!");
                    changeTab('settings');
                }
            };

            window.deleteProfileData = () => {
                if (confirm(getTranslation('confirm_delete'))) {
                    localStorage.removeItem('grammar_hub_1_profile');
                    userProfile = { name: "", avatar: "avatar1", customImg: "", totalStars: 0, soundEnabled: true, lang: "ms", darkMode: false, progress: {} };
                    alert("Profil dipadam!");
                    location.reload();
                }
            };
        }
    </script>
</body>
</html>
